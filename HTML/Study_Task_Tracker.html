<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Task Tracker</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        color: #222;
    }

    header {
        text-align: center;
        padding: 50px 20px;
        background: #1f2937;
        color: white;
    }

    header h1 {
        margin-bottom: 8px;
    }

    main {
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
    }

    section {
        background: white;
        padding: 25px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
        margin-bottom: 20px;
    }

    li {
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        margin-bottom: 10px;
        background: #f3f4f6;
        border-radius: 8px;
    }

    button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background: #1f2937;
        color: white;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.8;
    }

    footer {
        text-align: center;
        padding: 25px;
        color: #666;
    }
</style>

<script>
    const taskList = document.getElementById("taskList");
    const progress = document.getElementById("progress");

    const taskInput = document.getElementById("taskInput");
    const addTaskButton = document.getElementById("addTask");

    let completedTasks = 0;


    function updateProgress() {

        progress.textContent =
            completedTasks + " tasks completed";
    }


    function createTask(taskName) {

        const li = document.createElement("li");

        const span = document.createElement("span");

        span.textContent = taskName;

        const button = document.createElement("button");

        button.textContent = "Complete";


        button.addEventListener("click", function () {

            if (button.textContent === "Complete") {

                button.textContent = "Completed";

                completedTasks++;

                updateProgress();
            }
        });


        li.appendChild(span);

        li.appendChild(button);

        taskList.appendChild(li);
    }


    addTaskButton.addEventListener("click", function () {

        const taskName = taskInput.value.trim();

        if (taskName !== "") {

            createTask(taskName);

            taskInput.value = "";
        }
    });
</script>

<body>

    <header>
        <h1>Study Task Tracker</h1>
        <p>Organize. Learn. Improve.</p>
    </header>

    <main>

        <section>
            <h2>Today's Tasks</h2>

            <ul id="taskList">
                <li>
                    <span>Review HTML concepts</span>
                    <button>Complete</button>
                </li>

                <li>
                    <span>Practice CSS layouts</span>
                    <button>Complete</button>
                </li>

                <li>
                    <span>Practice JavaScript</span>
                    <button>Complete</button>
                </li>
            </ul>
        </section>

        <section>
    <h2>Add a Task</h2>

    <input
        type="text"
        id="taskInput"
        placeholder="Enter a new study task"
    >

    <button id="addTask">Add Task</button>
</section>

        <section>
            <h2>Progress</h2>
            <p id="progress">0 tasks completed</p>
        </section>

    </main>

    <footer>
        <p>Built while learning web development.</p>
    </footer>

</body>
</html>
