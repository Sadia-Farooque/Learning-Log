<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #f4f4f4;
        }

        .card {
            width: 400px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>JavaScript Practice</h1>
        <p>Learning JavaScript through simple interactions.</p>
        <button>Click Me</button>
    </div>

</body>
</html>

<script>
    const button = document.querySelector("button");

    button.addEventListener("click", function () {
        alert("JavaScript is working!");
    });
</script>
