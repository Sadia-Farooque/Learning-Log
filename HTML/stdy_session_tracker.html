<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Study Session Tracker</title>

</head>


<body>

    <header>

        <h1>Study Session Tracker</h1>

        <p>
            Track your study sessions and build consistency.
        </p>

    </header>


    <main>

        <section>

            <h2>Add Study Session</h2>

            <input
                type="text"
                id="subject"
                placeholder="Enter subject"
            >

            <input
                type="number"
                id="minutes"
                placeholder="Study minutes"
            >

            <button id="addSession">
                Add Session
            </button>

        </section>


        <section>

            <h2>Study Sessions</h2>

            <ul id="sessionList"></ul>

        </section>


        <section>

            <h2>Total Study Time</h2>

            <p id="totalTime">
                0 minutes
            </p>

        </section>

    </main>


    <footer>

        <p>
            Built while learning web development.
        </p>

    </footer>


</body>

</html>
