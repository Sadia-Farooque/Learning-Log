<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
        text-align: center;
    }

    header {
        background: #222;
        color: white;
        padding: 45px 20px;
    }

    header h1 {
        margin-bottom: 10px;
    }

    main {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
    }

    .timer-card {
        background: white;
        padding: 40px 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .timer-card h2 {
        margin-bottom: 30px;
    }

    #timer {
        font-size: 70px;
        font-weight: bold;
        margin-bottom: 30px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    button {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        background: #222;
        color: white;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.75;
    }

    #status {
        margin-top: 25px;
        color: #666;
    }

    footer {
        padding: 25px;
        color: #666;
    }

</style>
</head>

<body>

    <header>
        <h1>Focus Timer</h1>
        <p>A simple timer for focused study sessions.</p>
    </header>

    <main>
        <section class="timer-card">

            <h2>Study Session</h2>

            <div id="timer">25:00</div>

            <div class="buttons">
                <button id="startBtn">Start</button>
                <button id="pauseBtn">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>

            <p id="status">Ready to focus.</p>

        </section>
    </main>
    <script>

    const timerDisplay = document.getElementById("timer");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const status = document.getElementById("status");

    let timeLeft = 25 * 60;
    let timer = null;


    function updateDisplay() {

        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;

        timerDisplay.textContent =
            `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }


    startBtn.addEventListener("click", function () {

        if (timer !== null) {
            return;
        }

        status.textContent = "Focus session running...";

        timer = setInterval(function () {

            if (timeLeft > 0) {

                timeLeft--;

                updateDisplay();

            } else {

                clearInterval(timer);

                timer = null;

                status.textContent = "Session complete! Take a break.";
            }

        }, 1000);
    });


    pauseBtn.addEventListener("click", function () {

        clearInterval(timer);

        timer = null;

        status.textContent = "Timer paused.";
    });


    resetBtn.addEventListener("click", function () {

        clearInterval(timer);

        timer = null;

        timeLeft = 25 * 60;

        updateDisplay();

        status.textContent = "Timer reset. Ready to focus.";
    });


    updateDisplay();

</script>

    <footer>
        <p>Built as part of my learning journey.</p>
    </footer>

</body>
</html>
