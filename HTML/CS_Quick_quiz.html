<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Quick Quiz</title>

    <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
        line-height: 1.6;
    }

    header {
        text-align: center;
        padding: 45px 20px;
        background: #202020;
        color: white;
    }

    header h1 {
        margin-bottom: 8px;
    }

    main {
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
    }

    section {
        background: white;
        padding: 30px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .quiz-card h2 {
        margin-bottom: 25px;
    }

    #options {
        display: grid;
        gap: 12px;
    }

    #options button {
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 7px;
        background: #f8f8f8;
        cursor: pointer;
        text-align: left;
    }

    #options button:hover {
        background: #e9e9e9;
    }

    #nextBtn {
        margin-top: 25px;
        padding: 11px 20px;
        border: none;
        border-radius: 7px;
        background: #202020;
        color: white;
        cursor: pointer;
    }

    #result {
        margin-top: 20px;
        font-weight: bold;
    }

    .score-card {
        text-align: center;
    }

    #score {
        font-size: 35px;
        font-weight: bold;
    }

    footer {
        text-align: center;
        padding: 25px;
        color: #666;
    }

</style>
</head>

<body>

    <header>
        <h1>CS Quick Quiz</h1>
        <p>Test your computer science knowledge.</p>
    </header>

    <main>

        <section class="quiz-card">

            <h2 id="question">What does HTML stand for?</h2>

            <div id="options">

                <button>Hyper Text Markup Language</button>

                <button>High Tech Machine Language</button>

                <button>Hyperlink Text Management Language</button>

                <button>Home Tool Markup Language</button>

            </div>

            <p id="result"></p>

            <button id="nextBtn">Next Question</button>

        </section>

        <section class="score-card">
            <h2>Score</h2>
            <p id="score">0</p>
        </section>

    </main>

    <footer>
        <p>Learning by practicing concepts.</p>
    </footer>

    <script>

    const questions = [
        {
            question: "What does HTML stand for?",
            options: [
                "Hyper Text Markup Language",
                "High Tech Machine Language",
                "Hyperlink Text Management Language",
                "Home Tool Markup Language"
            ],
            answer: 0
        },

        {
            question: "Which language is mainly used to style webpages?",
            options: [
                "Python",
                "CSS",
                "C++",
                "SQL"
            ],
            answer: 1
        },

        {
            question: "Which language adds interactivity to webpages?",
            options: [
                "HTML",
                "CSS",
                "JavaScript",
                "XML"
            ],
            answer: 2
        }
    ];


    let currentQuestion = 0;
    let score = 0;


    const questionElement =
        document.getElementById("question");

    const optionsElement =
        document.getElementById("options");

    const resultElement =
        document.getElementById("result");

    const scoreElement =
        document.getElementById("score");

    const nextButton =
        document.getElementById("nextBtn");


    function loadQuestion() {

        const current = questions[currentQuestion];

        questionElement.textContent = current.question;

        optionsElement.innerHTML = "";

        resultElement.textContent = "";

        current.options.forEach(function (option, index) {

            const button = document.createElement("button");

            button.textContent = option;

            button.addEventListener("click", function () {

                if (index === current.answer) {

                    resultElement.textContent =
                        "Correct!";

                    score++;

                    scoreElement.textContent = score;

                } else {

                    resultElement.textContent =
                        "Incorrect. Try the next question.";
                }

            });

            optionsElement.appendChild(button);
        });
    }


    nextButton.addEventListener("click", function () {

        currentQuestion++;

        if (currentQuestion < questions.length) {

            loadQuestion();

        } else {

            questionElement.textContent =
                "Quiz Complete!";

            optionsElement.innerHTML = "";

            resultElement.textContent =
                `Final Score: ${score}/${questions.length}`;

            nextButton.style.display = "none";
        }
    });


    loadQuestion();

</script>

</body>
</html>
