<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
</head>

<body>

    <header>
        <h1>Password Strength Checker</h1>
        <p>Check the strength of your password.</p>
    </header>

    <main>

        <section>
            <h2>Enter Password</h2>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <p id="strength">
                Strength: Not checked
            </p>
        </section>

        <section>
            <h2>Password Requirements</h2>

            <ul>
                <li id="length">At least 8 characters</li>
                <li id="uppercase">Contains an uppercase letter</li>
                <li id="number">Contains a number</li>
                <li id="special">Contains a special character</li>
            </ul>

        </section>

    </main>

    <footer>
        <p>Built while learning JavaScript.</p>
    </footer>

</body>

</html>
