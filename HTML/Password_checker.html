<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Checker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        main {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        #strength {
            margin-top: 20px;
            font-weight: bold;
        }

        #requirements {
            margin-top: 20px;
        }

        #requirements p {
            margin: 8px 0;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: #c62828;
        }

        footer {
            text-align: center;
            color: #666;
            padding: 25px;
        }

    </style>
</head>

<body>

    <header>

        <h1>Password Strength Checker</h1>

        <p>Learn how JavaScript can analyze user input.</p>

    </header>


    <main>

        <section class="card">

            <h2>Check Your Password</h2>

            <input
                type="password"
                id="password"
                placeholder="Enter a password"
            >

            <p id="strength">
                Strength: Not checked
            </p>


            <div id="requirements">

                <p id="length">
                    ❌ At least 8 characters
                </p>

                <p id="uppercase">
                    ❌ Contains an uppercase letter
                </p>

                <p id="number">
                    ❌ Contains a number
                </p>

                <p id="special">
                    ❌ Contains a special character
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>Built while learning JavaScript.</p>

    </footer>


    <script>

        const password =
            document.getElementById("password");

        const strength =
            document.getElementById("strength");

        const lengthCheck =
            document.getElementById("length");

        const uppercaseCheck =
            document.getElementById("uppercase");

        const numberCheck =
            document.getElementById("number");

        const specialCheck =
            document.getElementById("special");


        password.addEventListener("input", function () {

            const value = password.value;


            const hasLength =
                value.length >= 8;

            const hasUppercase =
                /[A-Z]/.test(value);

            const hasNumber =
                /[0-9]/.test(value);

            const hasSpecial =
                /[!@#$%^&*]/.test(value);


            updateCheck(
                lengthCheck,
                hasLength,
                "At least 8 characters"
            );

            updateCheck(
                uppercaseCheck,
                hasUppercase,
                "Contains an uppercase letter"
            );

            updateCheck(
                numberCheck,
                hasNumber,
                "Contains a number"
            );

            updateCheck(
                specialCheck,
                hasSpecial,
                "Contains a special character"
            );


            const score =
                [hasLength, hasUppercase, hasNumber, hasSpecial]
                .filter(Boolean).length;


            if (value === "") {

                strength.textContent =
                    "Strength: Not checked";

            } else if (score <= 1) {

                strength.textContent =
                    "Strength: Weak";

            } else if (score <= 3) {

                strength.textContent =
                    "Strength: Medium";

            } else {

                strength.textContent =
                    "Strength: Strong";
            }

        });


        function updateCheck(element, condition, text) {

            if (condition) {

                element.textContent =
                    "✅ " + text;

                element.className = "valid";

            } else {

                element.textContent =
                    "❌ " + text;

                element.className = "invalid";
            }
        }

    </script>

</body>

</html>
