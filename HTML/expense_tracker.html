<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>

<body>

    <header>
        <h1>Expense Tracker</h1>
        <p>Keep track of your daily spending.</p>
    </header>

    <main>

        <section>
            <h2>Add Expense</h2>

            <input
                type="text"
                id="expenseName"
                placeholder="Expense name"
            >

            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount"
            >

            <button id="addExpense">Add Expense</button>
        </section>


        <section>
            <h2>Expenses</h2>

            <ul id="expenseList"></ul>
        </section>


        <section>
            <h2>Total Spent</h2>

            <p id="total">Rs. 0</p>
        </section>

    </main>


    <footer>
        <p>Built while learning JavaScript.</p>
    </footer>

</body>
</html>
